# 이 파일을 application.properties로 복사하고 본인 환경에 맞게 설정하세요.
# 실제 application.properties는 Git에 포함하지 않습니다.
server.port=8111
spring.datasource.url=jdbc:mysql://localhost:3306/won_dealer?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 32바이트 이상 난수의 Base64 문자열 (TokenProvider에서 Base64 디코딩)
jwt.secret=${JWT_SECRET}

# 이메일 인증 및 임시 비밀번호 발송
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=http://localhost:3000

# Google OAuth2: 승인된 리디렉션 URI
# http://localhost:8111/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# DataInitializer에서 첫 실행 시 생성하는 로컬 관리자 계정
admin.username=${ADMIN_USERNAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME}

# WonPay 충전 확인용 PortOne 서버 키 (충전 사용 시 설정)
portone.api-base-url=https://api.portone.io
portone.api-secret=${PORTONE_API_SECRET:}
trade.rate=0.05
withdraw.rate=0.01
